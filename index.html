function firstLetterKey(name) {

  return /[A-Z]/.test(ch) ? ch : '#';
}

  return SUBS.filter(s => (marks[s.name] || s.action) === filter);

  if (letter !== 'all') {

    items = items.filter(s => s.name.toLowerCase().includes(q));
